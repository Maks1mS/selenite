all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  altlinux.space/alt-atomic/selenite/internal/executil:
    config:
      dir: "{{.InterfaceDir}}/mocks"
      filename: "mock_runner.go"
      pkgname: mocks
    interfaces:
      Runner:
  charm.land/ssh:
    config:
      dir: "internal/serve/mocks"
      filename: "mock_ssh.go"
      pkgname: mocks
    interfaces:
      Context:
  altlinux.space/alt-atomic/selenite/internal/dashboard/components/status:
    config:
      dir: "internal/dashboard/mocks"
      filename: "mock_status.go"
      pkgname: mocks
    interfaces:
      Source:
        config:
          structname: MockStatusSource
  altlinux.space/alt-atomic/selenite/internal/dashboard/components/summary_card:
    config:
      dir: "internal/dashboard/mocks"
      filename: "mock_summary_card.go"
      pkgname: mocks
    interfaces:
      Source:
        config:
          structname: MockSummarySource
  altlinux.space/alt-atomic/selenite/internal/dashboard/components/journal:
    config:
      dir: "internal/dashboard/mocks"
      filename: "mock_journal.go"
      pkgname: mocks
    interfaces:
      Reader:
        config:
          structname: MockJournalReader
  altlinux.space/alt-atomic/selenite/internal/dashboard/pages/network:
    config:
      dir: "internal/dashboard/mocks"
      filename: "mock_network.go"
      pkgname: mocks
    interfaces:
      Backend:
        config:
          structname: MockNetworkBackend

on:
  pull_request_target:
    types:
      - closed
      - labeled

jobs:
  backporting:
    if: forgejo.event.pull_request.merged && contains(toJSON(forgejo.event.pull_request.labels), 'backport/release/')
    runs-on: als-huge-gh

    enable-openid-connect: true

    steps:
      - name: Get JWT
        id: jwt
        uses: maks1ms/get-oidc-jwt-action@8e5d43d89291d2659075ce452b2806ff3154d521 # v1.0.0
        with:
          aud: "u:776:c4f88c37-aefc-4418-b429-9fc3240c39d0"

      - uses: actions/git-backporting@b69251c55a7fba1a44ccbc9494c4c38ba95567e8 # v5.0.0
        with:
          target-branch-pattern: "^backport/(?<target>release/.*)$"
          strategy: ort
          strategy-option: find-renames
          cherry-pick-options: -x
          auth: ${{ steps.jwt.outputs.jwt }}
          pull-request: ${{ forgejo.event.pull_request.url }}
          auto-no-squash: true
          enable-err-notification: true
          git-client: codeberg
          git-user: alt-atomic-bot
          git-email: alt-atomic-bot@noreply.altlinux.space

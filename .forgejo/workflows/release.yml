on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # v1.0.0-rc.1, ...
      - '!v[0-9]+.[0-9]+.[0-9]+-dev' # exclude v1.0.0-dev

jobs:
  meta:
    runs-on: als-tiny
    outputs:
      prerelease: ${{ steps.m.outputs.prerelease }}
      image_aliases: ${{ steps.m.outputs.image_aliases }}
    steps:
      - name: detect prerelease and aliases
        id: m
        run: |
          if [[ "${FORGEJO_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "prerelease=false" >> "$FORGEJO_OUTPUT"
            echo "image_aliases=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$FORGEJO_OUTPUT"
          else
            echo "prerelease=true" >> "$FORGEJO_OUTPUT"
            echo "image_aliases=" >> "$FORGEJO_OUTPUT"
          fi

  build:
    needs: meta
    uses: ./.forgejo/workflows/reusable-build.yml
    secrets: inherit
    with:
      version: ${{ forgejo.ref_name }}
      git_commit: ${{ forgejo.sha }}
      git_ref: ${{ forgejo.ref }}
      image_aliases: ${{ needs.meta.outputs.image_aliases }}
      push: true

  release:
    needs: [meta, build]
    runs-on: als-tiny
    enable-openid-connect: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get JWT
        id: jwt
        uses: maks1ms/get-oidc-jwt-action@8e5d43d89291d2659075ce452b2806ff3154d521 # v1.0.0
        with:
          aud: "u:776:0020b0c9-ec42-475a-911b-098062393116"

      - name: release
        uses: actions/forgejo-release@98265452477dafb3f0f27ba9c462c90b18cb44fd # v2.13.4
        with:
          direction: upload
          skip-assets: true
          release-notes-assistant: true
          token: ${{ steps.jwt.outputs.jwt }}
          override: ${{ vars.RELEASE_OVERRIDE || 'false' }}
          verbose: ${{ vars.RELEASE_VERBOSE || 'false' }}
          prerelease: ${{ needs.meta.outputs.prerelease }}

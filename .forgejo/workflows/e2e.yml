name: E2E

on:
  push:
    branches:
      - 'wip-e2e'
  pull_request_target:
    types:
      - synchronize
      - labeled
      - closed

jobs:
  end-to-end-provision:
    if: >
      (
        forge.event_name == 'push' && ( forge.ref_name == 'wip-e2e' )
      ) || (
        forge.event_name == 'pull_request_target' && (
          forge.event.action == 'closed' ||
          ( forge.event.action == 'synchronized' && contains(forge.event.pull_request.labels.*.name, 'run-end-to-end-tests') ) ||
          ( forge.event.action == 'label_updated' && forge.event.label.name == 'run-end-to-end-tests' )
        )
      )
    runs-on: self-hosted-small-amd64
    outputs:
      vmid: ${{ steps.runner.outputs.vmid }}
      label: ${{ steps.runner.outputs.label }}
    steps:
      - &provision-runner
        name: Provision ephemeral runner
        id: runner
        uses: maks1ms/provision-ephemeral-runner-pve@a4697cd39a2a98527bdf26af2209f67a654f8a58
        with:
          action: 'create'
          pve_url: ${{ secrets.PVE_HOST }}
          pve_node: ${{ secrets.PVE_NODE }}
          pve_token_id: ${{ secrets.PVE_TOKEN_ID }}
          pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}
          forgejo_token: ${{ secrets.RUNNER_PROVISIONER_TOKEN }}
          pve_template_vmid: ${{ vars.PVE_TEMPLATE_VMID }}
          label: ${{ format('end-to-end-{0}', forgejo.run_id) }}

  end-to-end:
    needs: end-to-end-provision
    runs-on: ${{ needs.end-to-end-provision.outputs.label }}
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          repository: ${{ forgejo.event.pull_request.head.repo.full_name || forgejo.repository }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Configure usernamespaces
        run: |
          apt-get update
          apt-get install -y sysctl-conf-userns

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run E2E tests
        run: |
          task test-e2e

  end-to-end-cleanup:
    runs-on: self-hosted-small-amd64
    needs: [end-to-end-provision, end-to-end]
    if: always() && needs.end-to-end-provision.result != 'skipped'
    steps:
      - <<: *provision-runner
        name: Cleanup ephemeral runner
        with:
          action: 'delete'
          pve_url: ${{ secrets.PVE_HOST }}
          pve_node: ${{ secrets.PVE_NODE }}
          pve_token_id: ${{ secrets.PVE_TOKEN_ID }}
          pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}
          pve_vmid: ${{ needs.end-to-end-provision.outputs.vmid }}

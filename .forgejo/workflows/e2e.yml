name: E2E

on:
  push:
    branches:
      - 'wip-e2e'
  pull_request_target:
    types:
      - synchronize
      - labeled
      - closed

jobs:
  end-to-end-provision:
    if: >
      (
        forge.event_name == 'push' && ( forge.ref_name == 'wip-e2e' )
      ) || (
        forge.event_name == 'pull_request_target' && (
          forge.event.action == 'closed' ||
          ( forge.event.action == 'synchronized' && contains(forge.event.pull_request.labels.*.name, 'run-end-to-end-tests') ) ||
          ( forge.event.action == 'label_updated' && forge.event.label.name == 'run-end-to-end-tests' )
        )
      )
    runs-on: self-hosted-small-amd64
    outputs:
      vmid: ${{ steps.runner.outputs.vmid }}
      label: ${{ steps.runner.outputs.label }}
    steps:
      - name: Provision ephemeral runner
        id: runner
        uses: maks1ms/provision-ephemeral-runner-pve@e43e50dfd7cd59be9e8354b19d3bd9407f6108d2
        with:
          action: 'create'
          pve_url: ${{ secrets.PVE_HOST }}
          pve_node: ${{ secrets.PVE_NODE }}
          pve_token_id: ${{ secrets.PVE_TOKEN_ID }}
          pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}
          forgejo_token: ${{ secrets.RUNNER_PROVISIONER_TOKEN }}
          pve_template_vmid: ${{ vars.PVE_TEMPLATE_VMID }}
          label: ${{ format('end-to-end-{0}', forgejo.run_id) }}

  end-to-end:
    needs: end-to-end-provision
    runs-on: ${{ needs.end-to-end-provision.outputs.label }}
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Debug env
        run: |
          echo "HOME=$HOME"
          echo "whoami=$(whoami)"
          go env GOPATH GOMODCACHE

      - name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@ff3372fc50a47348610d722616f1a073aace0513 # v3.53.1
          echo "$(go env GOPATH)/bin" >> "$FORGEJO_PATH"

      - name: Install deps
        run: |
          apt-get update
          apt-get install -y \
            node \
            make \
            podman \
            buildah \
            buildkit \
            go-containerregistry-crane \
            jq \
            cosign \
            fuse-overlayfs \
            qemu-system-x86

      - name: Run E2E tests
        run: |
          task test-e2e

  end-to-end-cleanup:
    runs-on: self-hosted-small-amd64
    needs: [end-to-end-provision, end-to-end]
    if: always()
    steps:
      - name: Provision ephemeral runner
        id: runner
        uses: maks1ms/provision-ephemeral-runner-pve@main
        with:
          action: 'delete'
          pve_url: ${{ secrets.PVE_HOST }}
          pve_node: ${{ secrets.PVE_NODE }}
          pve_token_id: ${{ secrets.PVE_TOKEN_ID }}
          pve_token_secret: ${{ secrets.PVE_TOKEN_SECRET }}
          pve_vmid: ${{ needs.end-to-end-provision.outputs.vmid }}

name: Scan image for vulnerabilities

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  scan:
    name: Scan
    runs-on: als-huge

    container:
      image: altlinux.space/actions/runner/containers:sisyphus

    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run trivy
        run: |
          podman run --rm -it \
            -v "$PWD:/src" \
            -w /src \
            registry.altlinux.org/sisyphus/trivy:0.71.2@sha256:b530c804d4e31715e5e9673b9dccd248c8e56679eef2636fccb5e257a577e603 \
            image --scanners vuln --format json \
            --output trivy.json --exit-code 0 \
            --sbom-sources oci altlinux.space/alt-atomic/selenite/cloud:nightly

      - name: Upload trivy report
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: trivy
          path: trivy.json
          retention-days: 1

  upload:
    name: Upload to Sonarqube
    runs-on: als-tiny

    steps:
      - *checkout

      - name: Download trivy report
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b # v3.1.0-node20
        with:
          name: unit-coverage

      - name: Convert to sonar report
        run: |
          python3 scripts/trivy-to-sonar.py trivy.json trivy-sonar-report.json

      - name: SonarQube Scan
        uses: https://github.com/sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.externalIssuesReportPaths=trivy-sonar-report.json
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

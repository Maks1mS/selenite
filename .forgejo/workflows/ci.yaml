name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_NAME: alt-atomic/selenite/cloud
  REGISTRY: altlinux.space
  CACHE_IMAGE: altlinux.space/alt-atomic/selenite-cache
  LOCAL_BUILD_NAME: localhost/selenite

jobs:
  checks:
    name: Checks
    runs-on: als-huge
    steps:
      - &checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - &cache-tools-go
        uses: actions/cache-tools-go@caf05ca1aaddb81bb362d3e78635745aa473198e # v1.0.0
        with:
          go-version-file: go.mod

      - &setup-go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-python-3.13-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-python-3.13-
            pre-commit-${{ runner.os }}-

      - run: pip install pre-commit

      - &install-go-task
        name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@bd79c29a39b1fc4a7cdd0ef9f2c3cd2f06886e2a # v3.51.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: SKIP=test-unit pre-commit run --all-files

  test-unit:
    name: unit tests
    runs-on: als-huge
    steps:
      - *checkout

      - *cache-tools-go

      - *setup-go

      - *install-go-task

      - name: Run tests
        run: task test-unit

  build-image:
    name: Build image
    runs-on: als-huge
    needs: [fmt, test-unit]

    container:
      image: altlinux.space/alt-atomic/builder-image:sisyphus

    steps:
      - <<: *checkout
        with:
          fetch-depth: 0

      - name: Get image version
        id: version
        run: |
          VERSION=$(git describe --tags 2>/dev/null || git rev-parse --short HEAD)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Podman login
        run: |
          podman login --username="<token>" --password='${{ secrets.REGISTRY_TOKEN }}' $REGISTRY

      - name: Build image
        run: |
          podman build \
            --tag "${LOCAL_BUILD_NAME}" \
            --cache-from  "${CACHE_IMAGE}" \
            $([ "$FORGEJO_REF" = "refs/heads/main" ] && echo "--cache-to ${CACHE_IMAGE}") \
            .

      - name: Push images
        if: forgejo.ref == 'refs/heads/main'
        uses: alt-atomic/actions/push-and-sign@6a9494b07dbc1c84c85efc2aca800f86135c0acb
        with:
          registry: ${{ env.REGISTRY }}
          registry-username: "<token>"
          registry-password: ${{ secrets.REGISTRY_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ steps.version.outputs.value }}
          local-build-name: ${{ env.LOCAL_BUILD_NAME }}
          cosign-image-sign: ${{ secrets.IMAGE_SIGN }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
          image-aliases: nightly

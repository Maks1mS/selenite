name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_NAME: alt-atomic/selenite/cloud
  REGISTRY: altlinux.space
  CACHE_IMAGE: altlinux.space/alt-atomic/selenite-cache

jobs:
  checks:
    name: Checks
    runs-on: als-huge-gh

    container:
      image: altlinux.space/actions/runner/python:sisyphus

    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - &cache-tools-go
        uses: actions/cache-tools-go@caf05ca1aaddb81bb362d3e78635745aa473198e # v1.0.0
        with:
          go-version-file: go.mod

      - &setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - run: pip install pre-commit

      - &install-go-task
        name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@ff3372fc50a47348610d722616f1a073aace0513 # v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: SKIP=test-unit pre-commit run --all-files

  test-unit:
    name: unit tests
    runs-on: als-huge
    steps:
      - *checkout

      - *cache-tools-go

      - *setup-go

      - *install-go-task

      - name: Run tests
        run: task test-unit-coverage

      - &upload-unit-coverage
        name: Upload unit coverage
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: unit-coverage
          path: unit-coverage.out
          retention-days: 1

  test-integration:
    name: integration tests
    runs-on: als-huge
    steps:
      - *checkout

      - *cache-tools-go

      - *setup-go

      - *install-go-task

      - name: Run tests
        run: task test-integration-coverage

      - <<: *upload-unit-coverage
        name: Upload integration coverage
        with:
          name: integration-coverage
          path: integration-coverage.out
          retention-days: 1

  # sonarqube:
  #   name: SonarQube Scan
  #   runs-on: als-huge-gh
  #   needs: [test-unit, test-integration]
  #   if: github.event_name != 'pull_request'
  #   steps:
  #     - <<: *checkout
  #       with:
  #         fetch-depth: 0

  #     - &download-unit-coverage
  #       name: Download unit coverage
  #       uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b # v3.1.0-node20
  #       with:
  #         name: unit-coverage

  #     - <<: *download-unit-coverage
  #       name: Download integration coverage
  #       with:
  #         name: integration-coverage

  #     - name: SonarQube Scan
  #       uses: https://github.com/sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  generate-version:
    name: Generate version
    runs-on: als-tiny

    outputs:
      version: ${{ steps.version.outputs.version }}
      git_commit: ${{ steps.version.outputs.git_commit }}

    steps:
      - <<: *checkout
        with:
          fetch-depth: 0

      - name: Get image version
        id: version
        run: |
          VERSION=$(git describe --tags 2>/dev/null || git rev-parse --short HEAD)
          echo "version=$VERSION" >> $FORGEJO_OUTPUT
          echo "git_commit=$(git rev-parse HEAD)" >> $FORGEJO_OUTPUT

  build-image:
    name: Build image
    runs-on: als-huge
    needs: [generate-version, checks, test-unit, test-integration]

    container:
      image: altlinux.space/alt-atomic/builder-image:sisyphus

    enable-openid-connect: true

    steps:
      - *checkout

      - &get-jwt
        name: Get JWT
        id: jwt
        uses: alt-atomic/actions/get-oidc-jwt@0b93dfe7ce3670b45ca16ceb1d8fd55ee080c276
        with:
          aud: "u:776:cdd6fb48-aeb1-4f4f-b02d-9add5837ea6a"

      - name: Compute podman extra args
        id: podman_args
        run: |
          ARGS="--cache-from $CACHE_IMAGE"
          if [ "$FORGEJO_REF" = "refs/heads/main" ]; then
            ARGS="$ARGS --cache-to $CACHE_IMAGE"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: alt-atomic/actions/build-and-push@e835eedfc64536d16df2a43259d034c5cb25e8ce
        with:
          image-name: alt-atomic/selenite/cloud/amd64
          image-tag: ${{ needs.generate-version.outputs.version }}
          image-aliases: nightly

          packages-info-enabled: false

          build-args: |
            VERSION=${{ needs.generate-version.outputs.version }}
            GIT_COMMIT=${{ needs.generate-version.outputs.git_commit }}

          podman-extra-args: ${{ steps.podman_args.outputs.args }}

          pretty-name: Selenite
          version: ${{ needs.generate-version.outputs.version }}
          source: ${{ forgejo.server_url }}/${{ forgejo.repository }}
          rechunk-enabled: true
          experimental-use-chunkah: true
          sbom-attestation-enabled: true
          extra-labels: |
            org.alt-atomic.installer.custom-preset=selenite

          push-enabled: ${{ forgejo.ref == 'refs/heads/main' }}
          registry-password: ${{ steps.jwt.outputs.jwt }}
          cosign-image-sign: ${{ secrets.IMAGE_SIGN }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

  build-image-manifest:
    if: ${{ forgejo.ref == 'refs/heads/main' }}
    name: Build image manifest
    runs-on: als-huge
    needs: [generate-version, build-image]

    container:
      image: altlinux.space/alt-atomic/builder-image:sisyphus

    enable-openid-connect: true

    steps:
      - *get-jwt

      - name: Create manifest
        uses: alt-atomic/actions/create-manifest@e835eedfc64536d16df2a43259d034c5cb25e8ce
        with:
            registry: ${{ env.REGISTRY }}
            registry-username: "<token>"
            registry-password: ${{ steps.jwt.outputs.jwt }}

            image-name: alt-atomic/selenite/cloud
            image-wildcard: ${{ format('{0}/alt-atomic/selenite/cloud/@ARCH@:{1}', env.REGISTRY, needs.generate-version.outputs.version) }}
            arch-tags: amd64

            image-tag: ${{ needs.generate-version.outputs.version }}
            image-aliases: nightly

            cosign-image-sign: ${{ secrets.IMAGE_SIGN }}
            cosign-password: ${{ secrets.COSIGN_PASSWORD }}

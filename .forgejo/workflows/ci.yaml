name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_NAME: alt-atomic/selenite/cloud
  REGISTRY: altlinux.space
  CACHE_IMAGE: altlinux.space/alt-atomic/selenite-cache

jobs:
  checks:
    name: Checks
    runs-on: als-huge-gh

    container:
      image: altlinux.space/actions/runner/python:sisyphus

    steps:
      - &checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - &cache-tools-go
        uses: actions/cache-tools-go@caf05ca1aaddb81bb362d3e78635745aa473198e # v1.0.0
        with:
          go-version-file: go.mod

      - &setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - run: pip install pre-commit

      - &install-go-task
        name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@bd79c29a39b1fc4a7cdd0ef9f2c3cd2f06886e2a # v3.51.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: SKIP=test-unit pre-commit run --all-files

  test-unit:
    name: unit tests
    runs-on: als-huge
    steps:
      - *checkout

      - *cache-tools-go

      - *setup-go

      - *install-go-task

      - name: Run tests
        run: task test-unit

  test-integration:
    name: integration tests
    runs-on: als-huge
    steps:
      - *checkout

      - *cache-tools-go

      - *setup-go

      - *install-go-task

      - name: Run tests
        run: task test-integration

  build-image:
    name: Build image
    runs-on: als-huge
    needs: [checks, test-unit, test-integration]

    container:
      image: altlinux.space/alt-atomic/builder-image:sisyphus

    steps:
      - <<: *checkout
        with:
          fetch-depth: 0

      - name: Get image version
        id: version
        run: |
          VERSION=$(git describe --tags 2>/dev/null || git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Compute podman extra args
        id: podman_args
        run: |
          ARGS="--cache-from $CACHE_IMAGE"
          if [ "$FORGEJO_REF" = "refs/heads/main" ]; then
            ARGS="$ARGS --cache-to $CACHE_IMAGE"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: alt-atomic/actions/build-and-push@6bf2462132a219c679b8a05aeb3d09fb40a880c2 # feat/add-chunkah
        with:
          image-name: alt-atomic/selenite/cloud
          image-tag: ${{ steps.version.outputs.version }}
          image-aliases: nightly

          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ steps.version.outputs.git_commit }}

          podman-extra-args: ${{ steps.podman_args.outputs.args }}

          pretty-name: Selenite
          version: ${{ steps.version.outputs.version }}
          source: ${{ forgejo.server_url }}/${{ forgejo.repository }}
          rechunk-enabled: true
          experimental-use-chunkah: true

          push-enabled: ${{ forgejo.ref == 'refs/heads/main' }}
          registry-password: ${{ secrets.REGISTRY_TOKEN }}
          cosign-image-sign: ${{ secrets.IMAGE_SIGN }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

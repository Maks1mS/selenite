name: CI

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: alt-atomic-lab/selenite/cloud
  REGISTRY: altlinux.space
  CACHE_IMAGE: altlinux.space/alt-atomic-lab/selenite-cache
  LOCAL_BUILD_NAME: localhost/selenite

jobs:
  build-image:
    name: Build image
    runs-on: als-huge
    container:
      image: altlinux.space/alt-atomic/builder-image:sisyphus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get image version
        id: version
        run: |
          VERSION=$(git describe --tags 2>/dev/null || git rev-parse --short HEAD)
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Podman login
        run: |
          podman login --username="<token>" --password='${{ secrets.REGISTRY }}' $REGISTRY

      - name: Build image
        run: |
          podman build \
            --tag $LOCAL_BUILD_NAME \
            --cache-from  "${CACHE_IMAGE}" \
            --cache-to    "${CACHE_IMAGE}" \
            . 

      - name: Push images
        uses: alt-atomic/actions/push-and-sign@6a9494b07dbc1c84c85efc2aca800f86135c0acb
        with:
          registry: ${{ env.REGISTRY }}
          registry-username: "<token>"
          registry-password: ${{ secrets.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ steps.version.outputs.value }}
          local-build-name: ${{ env.LOCAL_BUILD_NAME }}
          image-aliases: nightly

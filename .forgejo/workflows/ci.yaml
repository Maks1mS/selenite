name: CI

on:
  push:
    branches:
      - main
      - release/*
  pull_request:

env:
  IMAGE_NAME: alt-atomic/selenite/cloud
  REGISTRY: altlinux.space
  CACHE_IMAGE: altlinux.space/alt-atomic/selenite-cache

jobs:
  checks:
    name: Checks
    runs-on: als-huge

    container:
      image: altlinux.space/actions/runner/python:sisyphus

    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - &cache-tools-go
        uses: actions/cache-tools-go@caf05ca1aaddb81bb362d3e78635745aa473198e # v1.0.0
        with:
          go-version-file: go.mod

      - &setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - run: pip install pre-commit

      - &install-deps
        name: Install deps
        run: apt-get update && apt-get install -y libsystemd-devel

      - &install-go-task
        name: Install go-task
        run: |
          go install github.com/go-task/task/v3/cmd/task@ff3372fc50a47348610d722616f1a073aace0513 # v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: SKIP=test-unit pre-commit run --all-files

  test-unit:
    name: unit tests
    runs-on: als-huge
    steps:
      - *checkout

      - *cache-tools-go

      - *setup-go

      - *install-go-task

      - *install-deps

      - name: Run tests
        run: task test-unit-coverage

      - &upload-unit-coverage
        name: Upload unit coverage
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: unit-coverage
          path: unit-coverage.out
          retention-days: 1

  test-integration:
    name: integration tests
    runs-on: als-huge
    steps:
      - *checkout

      - *cache-tools-go

      - *setup-go

      - *install-go-task

      - *install-deps

      - name: Run tests
        run: task test-integration-coverage

      - <<: *upload-unit-coverage
        name: Upload integration coverage
        with:
          name: integration-coverage
          path: integration-coverage.out
          retention-days: 1


  #     - name: SonarQube Scan
  #       uses: https://github.com/sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  generate-version:
    name: Generate version
    runs-on: als-tiny

    outputs:
      version: ${{ steps.version.outputs.version }}
      git_commit: ${{ steps.version.outputs.git_commit }}
      image_aliases: ${{ steps.version.outputs.image_aliases }}

    steps:
      - <<: *checkout
        with:
          fetch-depth: 0

      - name: Get image version
        id: version
        env:
          GIT_REF: ${{ forgejo.ref }}
        run: |
          VERSION=$(git describe --tags 2>/dev/null || git rev-parse --short HEAD)
          echo "version=$VERSION" >> $FORGEJO_OUTPUT
          echo "git_commit=$(git rev-parse HEAD)" >> $FORGEJO_OUTPUT

          case "$GIT_REF" in
            refs/heads/main)
              echo "image_aliases=nightly" >> "$FORGEJO_OUTPUT"
              ;;
            refs/heads/release/v*)
              echo "image_aliases=nightly-${GIT_REF#refs/heads/release/}" >> "$FORGEJO_OUTPUT"
              ;;
            *)
              echo "image_aliases=" >> "$FORGEJO_OUTPUT"
              ;;
          esac

  build:
    needs: [generate-version]
    uses: ./.forgejo/workflows/reusable-build.yml
    secrets: inherit
    with:
      version: ${{ needs.generate-version.outputs.version }}
      git_commit: ${{ needs.generate-version.outputs.git_commit }}
      git_ref: ${{ forgejo.ref }}
      image_aliases: ${{ needs.generate-version.outputs.image_aliases }}
      push: ${{ forgejo.ref == 'refs/heads/main' || startsWith(forgejo.ref, 'refs/heads/release/') }}

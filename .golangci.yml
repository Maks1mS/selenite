version: "2"
linters:
  enable:
    - gocritic
    - gosec
    - wrapcheck
    - contextcheck
    - dupl
    - bodyclose
    - exptostd
    - exhaustive
    - unparam
    - nilnil
    - nilerr
    - errorlint
    - gocognit
issues:
  fix: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - altlinux.space/alt-atomic-lab/selenite

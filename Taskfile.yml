# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GOLANGCI_LINT_BIN: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@8f3b0c7ed018e57905fbd873c697e0b1ede605a5 # v2.11.4

includes:
  dev:
    taskfile: ./taskfiles/dev.yml
    dir: .

tasks:
  fmt:
    desc: "Run golangci-lint with auto-fix"
    cmds:
      - "{{.GOLANGCI_LINT_BIN}} run --fix"

  lint:
    desc: "Run golangci-lint"
    preconditions:
      - sh: "test -f go.mod"
        msg: "go.mod not found — run from project root"
    cmds:
      - "{{.GOLANGCI_LINT_BIN}} run"

  test-unit:
    desc: "Run unit tests"
    cmds:
      - go test -v ./...

  test-e2e:
    desc: "Run e2e tests"
    vars:
      E2E_PARALLELISM: '4'
    cmds:
      - "./scripts/prepare-e2e.sh"
      - go test -tags=e2e -count=1 -p {{.E2E_PARALLELISM}} -v ./tests/e2e/
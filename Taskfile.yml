# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GOLANGCI_LINT_BIN: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.2

tasks:
  fmt:
    desc: "Run golangci-lint with auto-fix"
    cmds:
      - "{{.GOLANGCI_LINT_BIN}} run --fix"

  lint:
    desc: "Run golangci-lint"
    cmds:
      - "{{.GOLANGCI_LINT_BIN}} run"

  run-vm:
    desc: "Start VM for interactive debugging"
    cmds:
      - "./scripts/prepare-e2e.sh"
      - |
        echo "=== VM starting — Selenite SSH: ssh -p 23234 selenite@localhost ==="
        qemu-system-x86_64 \
          -enable-kvm \
          -m 2048M \
          -drive file=/var/tmp/selenite/disk.raw,format=raw,if=virtio,snapshot=on \
          -netdev user,id=net0,hostfwd=tcp::23234-:23234 \
          -device virtio-net-pci,netdev=net0

  test-e2e:
    cmds:
      - "./scripts/prepare-e2e.sh"
      - "go test -tags=e2e -count=1 -p 4 -v ./tests/e2e/"
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GOLANGCI_LINT_BIN: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@25c5369a93aacb8cccea0d46e1569ca4a194564d # v2.15.0
  GO_LICENSES_BIN: go run github.com/google/go-licenses/v2@3e084b0caf710f7bfead967567539214f598c0a2 # v2.0.1
  ADDLICENSE_BIN: go run github.com/google/addlicense@b289835c0741ba2fb92dd5f61af070e79c69a55e # v1.2.0
  ALLOWED_LICENSES: MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0,MPL-2.0-no-copyleft-exception
  ADDLICENSE_IGNORE: "-ignore=vendor/** -ignore=.git/** -ignore=**/*.yml -ignore=**/*.yaml"
  MOCKERY_BIN: go run github.com/vektra/mockery/v3@0ddc8e48058a948e0c085b5d929ef93b8172d0fd # v3.8.1
  VERSION: '{{.VERSION | default "dev"}}'
  GIT_COMMIT: '{{.GIT_COMMIT | default "unknown"}}'
  LDFLAGS: >-
    -s -w
    -X altlinux.space/alt-atomic/selenite/internal/version.Version={{.VERSION}}
    -X altlinux.space/alt-atomic/selenite/internal/version.GitCommit={{.GIT_COMMIT}}
  BINARIES:
    - selenite-controller:usr/bin/selenite-controller
    - selenite-dashboard:usr/bin/selenite-dashboard
    - selenite-dashboard-helper:usr/libexec/selenite-controller/selenite-dashboard-helper
    - podman-compose-helper:usr/libexec/selenite-controller/podman-compose-helper
    - podman-secret-helper:usr/libexec/selenite-controller/podman-secret-helper
    - podman-volume-helper:usr/libexec/selenite-controller/podman-volume-helper
    - podman-network-helper:usr/libexec/selenite-controller/podman-network-helper
    - selenite-machine-helper:usr/libexec/selenite-controller/selenite-machine-helper
    - sysctl-helper:usr/libexec/selenite-controller/sysctl-helper
    - netbird-helper:usr/libexec/selenite-controller/netbird-helper
    - alloy-helper:usr/libexec/selenite-controller/alloy-helper
    - nmstate-helper:usr/libexec/selenite-controller/nmstate-helper
    - debug-helper:usr/libexec/selenite-controller/debug-helper
    - zram-helper:usr/libexec/selenite-controller/zram-helper

includes:
  dev:
    taskfile: ./taskfiles/dev.yml
    dir: .

tasks:
  dist:
    desc: "Build all binaries into DESTDIR, preserving final image layout"
    vars:
      DESTDIR: '{{.DESTDIR | default "/out"}}'
    cmds:
      - for: {var: BINARIES}
        cmd: |
          ITEM="{{.ITEM}}"
          bin="${ITEM%%:*}"
          dest="{{.DESTDIR}}/${ITEM#*:}"
          mkdir -p "$(dirname "$dest")"
          CGO_ENABLED=1 GOOS=linux go build \
            -ldflags="{{.LDFLAGS}}" \
            -trimpath -o "$dest" ./cmd/$bin

  fmt:
    desc: "Run golangci-lint with auto-fix"
    cmds:
      - "{{.GOLANGCI_LINT_BIN}} run --fix"

  lint:
    desc: "Run golangci-lint"
    preconditions:
      - sh: "test -f go.mod"
        msg: "go.mod not found — run from project root"
    cmds:
      - "{{.GOLANGCI_LINT_BIN}} run"

  test-unit:
    desc: "Run unit tests"
    cmds:
      - go test -v ./...

  test-golden-update:
    desc: "Regenerate golden files of the dashboard TUI tests"
    cmds:
      - UPDATE_GOLDEN=1 go test ./internal/dashboard/...

  test-unit-coverage:
    desc: "Run unit tests with coverage"
    cmds:
      - go test -v -coverpkg=./... -coverprofile=unit-coverage.out ./...

  test-integration:
    desc: "Run integration tests"
    cmds:
      - go test -v -tags=integration ./tests/integration/

  test-integration-coverage:
    desc: "Run integration tests with coverage"
    cmds:
      - go test -v -tags=integration -coverpkg=./... -coverprofile=integration-coverage.out ./tests/integration/

  test-e2e:
    desc: "Run e2e tests"
    vars:
      E2E_PARALLELISM: '4'
      TEST_FILTER: '{{if .TESTS}}-run {{.TESTS}}{{end}}'
    cmds:
      - "./scripts/prepare-e2e.sh"
      - go test -tags=e2e -timeout 60m -count=1 -p {{.E2E_PARALLELISM}} -v {{.TEST_FILTER}} ./tests/e2e/

  license-headers:
    desc: "Check that all source files have the MPL-2.0 header"
    cmds:
      - "{{.ADDLICENSE_BIN}} -check -l mpl {{.ADDLICENSE_IGNORE}} ."

  license-headers-fix:
    desc: "Add the MPL-2.0 header to source files that are missing it"
    cmds:
      - "{{.ADDLICENSE_BIN}} -l mpl {{.ADDLICENSE_IGNORE}} ."

  license-check:
    desc: "Check dependency licenses are compatible with MPL-2.0"
    preconditions:
      - sh: "test -f go.mod"
        msg: "go.mod not found"
    cmds:
      - "{{.GO_LICENSES_BIN}} check ./... --allowed_licenses={{.ALLOWED_LICENSES}}"

  mocks:
    desc: "Generate testify mocks from interfaces using mockery"
    cmds:
      - "{{.MOCKERY_BIN}} --config .mockery.yml"

  license-report:
    desc: "Generate third-party license report"
    preconditions:
      - sh: "test -f go.mod"
        msg: "go.mod not found"
    cmds:
      - "{{.GO_LICENSES_BIN}} report ./... > THIRD_PARTY_LICENSES.md"
      - 'echo "Report written to THIRD_PARTY_LICENSES.md"'

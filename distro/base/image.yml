modules:
  - name: Copy root
    type: copy
    body:
      source: root
      destination: /
      replace: true

  - name: Update kernel
    type: kernel
    body:
      kernel-info:
        flavour: for-vm
      initrd:
        method: dracut

  - name: Include
    type: include
    body:
      targets:
        - controller-deps.yml
        - qemu-guest-agent.yml

  - name: Set branding
    type: branding
    body:
      release-overrides:
        ID: "selenite"
        IMAGE_ID: "selenite"
        NAME: "Selenite"
        PRETTY_NAME: "Selenite"
        VERSION: "${{ Env.VERSION }}"
        VERSION_ID: "${{ Env.VERSION }}"
        VARIANT: "Cloud"
        VARIANT_ID: "cloud"
        BUILD_ID: "Selenite ${{ Env.VERSION }}"
        BUG_REPORT_URL: "https://altlinux.space/alt-atomic/selenite/issues"

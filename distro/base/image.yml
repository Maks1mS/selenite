modules:
  - name: Copy root
    type: copy
    body:
      source: root
      destination: /
      replace: true

  - name: Update kernel
    type: kernel
    body:
      kernel-info:
        flavour: for-vm
      initrd:
        method: dracut

  - name: Include
    type: include
    body:
      targets:
        - greenboot.yml
        - controller-deps.yml
        - qemu-guest-agent.yml

modules:
  - name: Add Selenite repo
    type: repos
    body:
      custom:
        - rpm https://altlinux.space/api/packages/alt-atomic-packages/alt/group/selenite-packages/v0.1.0-dev-4-ge9b8927.repo noarch classic

  - name: Copy root
    type: copy
    body:
      source: root
      destination: /
      replace: true

  - name: Update kernel
    type: kernel
    body:
      kernel-info:
        flavour: for-vm
      initrd:
        method: dracut

  - name: Include
    type: include
    body:
      targets:
        - greenboot.yml
        - controller-deps.yml
        - qemu-guest-agent.yml
        - growpart.yml

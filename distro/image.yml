modules:
  - name: Copy root
    type: copy
    body:
      source: root
      destination: /
      replace: true

  - name: Create users and groups
    type: shell
    body:
      command: |
        systemd-sysusers /usr/lib/sysusers.d/selenite.conf

  - name: Enable rootless podman for _selenite-podman-executor
    type: shell
    body:
      command: |
        control newuidmap public
        control newgidmap public
        usermod --add-subuids 100000-165536 --add-subgids 100000-165536 _selenite-podman-executor

  - name: System Services
    type: systemd
    body:
      targets:
        - selenite-controller.service
        - selenite-setup.service
      enabled: true

  - name: Base cleanup
    type: include
    body:
      targets:
        - /usr/share/apm/includes/common/cleanup.yml

  - name: Better cleanup
    type: include
    body:
      targets:
        - better-cleanup.yml
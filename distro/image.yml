modules:
  - name: Copy root
    type: copy
    body:
      source: root
      destination: /
      replace: true

  - name: '[HACK] Restore passwd and group'
    type: shell
    body:
      command: |
        cat /etc/passwd /usr/lib/passwd |
          sort -u -t: -k1,1 > /tmp/passwd_m &&
          mv /tmp/passwd_m /etc/passwd &&
          rm /usr/lib/passwd

        cat /etc/group /usr/lib/group |
          sort -u -t: -k1,1 > /tmp/group_m &&
          mv /tmp/group_m /etc/group &&
          rm /usr/lib/group

  - name: Create users and groups
    type: shell
    body:
      command: |
        systemd-sysusers

  - name: Enable rootless podman for _selenite-podman-executor
    type: shell
    body:
      command: |
        control newuidmap public
        control newgidmap public
        usermod --add-subuids 100000-165536 --add-subgids 100000-165536 _selenite-podman-executor

  - name: Apply systemd presets
    type: shell
    body:
      command: |
        systemctl preset-all

  - name: Base cleanup
    type: include
    body:
      targets:
        - /usr/share/apm/includes/common/cleanup.yml

  - name: Better cleanup
    type: include
    body:
      targets:
        - better-cleanup.yml

  - name: Post build checks
    type: include
    body:
      targets:
        - post-build-checks.yml

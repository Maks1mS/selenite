# selenite-controller home dir
d  /var/lib/selenite-controller            0755 _selenite-controller _selenite-controller -
Z  /var/lib/selenite-controller            -    _selenite-controller _selenite-controller -

# ssh authorized_keys is provisioned externally at deploy time
d /var/lib/selenite-controller/.ssh                  0700 _selenite-controller _selenite-controller -
f /var/lib/selenite-controller/.ssh/authorized_keys 0600 _selenite-controller _selenite-controller -

# selenite-podman-executor home dir
d  /var/lib/selenite-podman-executor        0755 _selenite-podman-executor _selenite-podman-executor -

# linger for the user systemd instance (replaces loginctl enable-linger)
f /var/lib/systemd/linger/_selenite-podman-executor - _selenite-podman-executor _selenite-podman-executor -

# user-level units enabled for _selenite-podman-executor
d  /var/lib/selenite-podman-executor/.config                                    0755 _selenite-podman-executor _selenite-podman-executor -
d  /var/lib/selenite-podman-executor/.config/systemd                            0755 _selenite-podman-executor _selenite-podman-executor -
d  /var/lib/selenite-podman-executor/.config/systemd/user                       0755 _selenite-podman-executor _selenite-podman-executor -
d  /var/lib/selenite-podman-executor/.config/systemd/user/default.target.wants  0755 _selenite-podman-executor _selenite-podman-executor -

L+ /var/lib/selenite-podman-executor/.config/systemd/user/default.target.wants/podman.socket          - _selenite-podman-executor _selenite-podman-executor - /usr/lib/systemd/user/podman.socket
L+ /var/lib/selenite-podman-executor/.config/systemd/user/default.target.wants/podman-restart.service - _selenite-podman-executor _selenite-podman-executor - /usr/lib/systemd/user/podman-restart.service

# stacks subdir is managed by selenite
d  /var/lib/selenite-podman-executor/stacks 2770 _selenite-controller _selenite-workloads -
Z  /var/lib/selenite-podman-executor/stacks -    _selenite-controller _selenite-workloads -

# selenite-dashboard home dir
d  /var/lib/selenite-dashboard              0755 _selenite-dashboard _selenite-dashboard -
Z  /var/lib/selenite-dashboard              -    _selenite-dashboard _selenite-dashboard -
f  /var/lib/selenite-dashboard/.hushlogin   0644 _selenite-dashboard _selenite-dashboard -

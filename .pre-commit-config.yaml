repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://code.forgejo.org/forgejo/runner
    rev: 4140a19a2e1d1d865bbe5b9e7ee13e00c8c5f6a9 # v12.13.2
    hooks:
      - id: forgejo-runner-validate
  - repo: local
    hooks:
      - id: lint
        name: Run lint
        entry: task lint
        language: system
        pass_filenames: false
      - id: license-headers
        name: Run license-headers
        entry: task license-headers
        language: system
        pass_filenames: false
      - id: license-check
        name: Run license-check
        entry: task license-check
        language: system
        pass_filenames: false
      - id: test-unit
        name: Run test-unit
        entry: task test-unit
        language: system
        pass_filenames: false

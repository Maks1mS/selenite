repos:
  - repo: https://code.forgejo.org/forgejo/runner
    rev: 6d1d83364da92c634316dea2d9c66504b1c535bc # v12.7.1
    hooks:
      - id: forgejo-runner-validate
  - repo: local
    hooks:
      - id: lint
        name: Run lint
        entry: task lint
        language: system
        pass_filenames: false
      - id: license-headers
        name: Run license-headers
        entry: task license-headers
        language: system
        pass_filenames: false
      - id: license-check
        name: Run license-check
        entry: task license-check
        language: system
        pass_filenames: false
      - id: test-unit
        name: Run test-unit
        entry: task test-unit
        language: system
        pass_filenames: false
